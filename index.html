<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toynya's Furry AI Portal | 獸人靈感終端</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            p5red: '#e60012',
            hifiorange: '#f97316',
            hifiyellow: '#fbbf24',
            sagegreen: '#4bb59b',
            cyanblue: '#0ea5e9',
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: #05050a;
      overflow-x: hidden;
      transition: background-color 0.5s ease;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.3); border-radius: 999px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(217, 70, 239, 0.5); }

    /* 氣泡背景動畫 */
    @keyframes float-bubble {
      0% { transform: translateY(0px) scale(1); opacity: 0.15; }
      50% { transform: translateY(-40px) scale(1.1); opacity: 0.3; }
      100% { transform: translateY(0px) scale(1); opacity: 0.15; }
    }
    .bubble-1 { animation: float-bubble 8s ease-in-out infinite; }
    .bubble-2 { animation: float-bubble 12s ease-in-out infinite 2s; }
    .bubble-3 { animation: float-bubble 16s ease-in-out infinite 4s; }

    /* P5 風格傾斜 */
    .p5-skew { transform: skewX(-6deg); }
    .p5-unskew { transform: skewX(6deg); }
    .p5-shadow-red { box-shadow: 6px 6px 0px 0px #e60012; }
    .p5-shadow-orange { box-shadow: 6px 6px 0px 0px #f97316; }

    /* 點陣與網格 */
    .dotted-bg {
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .light .dotted-bg {
      background-image: radial-gradient(rgba(0, 0, 0, 0.05) 1px, transparent 1px);
    }
  </style>
</head>
<body class="text-slate-200 dark:bg-[#030308] bg-[#f8fafc] dotted-bg min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 圖標映射
    const Icons = {
      Chat: ({className}) => <i className={`ph ph-chats-teardrop ${className}`}></i>,
      Dice: ({className}) => <i className={`ph ph-dice-five ${className}`}></i>,
      Prompt: ({className}) => <i className={`ph ph-terminal-window ${className}`}></i>,
      Tools: ({className}) => <i className={`ph ph-toolbox ${className}`}></i>,
      Twitter: ({className}) => <i className={`ph ph-twitter-logo ${className}`}></i>,
      Sparkles: ({className}) => <i className={`ph ph-sparkle ${className}`}></i>,
      Commission: ({className}) => <i className={`ph ph-scroll ${className}`}></i>,
      MessageBoard: ({className}) => <i className={`ph ph-note-blank ${className}`}></i>,
      Sun: ({className}) => <i className={`ph ph-sun ${className}`}></i>,
      Moon: ({className}) => <i className={`ph ph-moon ${className}`}></i>,
      Check: ({className}) => <i className={`ph ph-check-circle ${className}`}></i>,
      Warning: ({className}) => <i className={`ph ph-warning-circle ${className}`}></i>,
      Upload: ({className}) => <i className={`ph ph-upload-simple ${className}`}></i>,
      Send: ({className}) => <i className={`ph ph-paper-plane-tilt ${className}`}></i>,
      Lock: ({className}) => <i className={`ph ph-lock ${className}`}></i>,
      Unlock: ({className}) => <i className={`ph ph-lock-key-open ${className}`}></i>,
      Settings: ({className}) => <i className={`ph ph-gear ${className}`}></i>,
      Heart: ({className}) => <i className={`ph ph-heart ${className}`}></i>,
      ArrowRight: ({className}) => <i className={`ph ph-arrow-right ${className}`}></i>,
      Admin: ({className}) => <i className={`ph ph-shield-star ${className}`}></i>,
      Trash: ({className}) => <i className={`ph ph-trash ${className}`}></i>,
    };

    const DEFAULT_COMMENTS = [
      { id: 1, name: "クロサキ", avatar: "🐱", aura: "cyan", text: "トイニャ老師的魔化三花貓真的太可愛了！新版聊天系統互動好黏人，喵喵叫受不了~❤", time: "2025/02/10" },
      { id: 2, name: "KemoLover", avatar: "🦊", aura: "orange", text: "TRPG跑團系統的判定機制做得好硬核，P5風格大讚！希望未來能出更多劇本！", time: "2025/02/12" },
      { id: 3, name: "AI呪術師", avatar: "🐉", aura: "purple", text: "Prompt 生成器的 e621 反推真的神，再也不用為 NAI V4 該塞什麼 tags 煩惱了！", time: "2025/02/13" }
    ];

    function MainPortal() {
      const [isDark, setIsDark] = useState(true);
      const [activeTab, setActiveTab] = useState("commission"); // commission | board
      
      // 留言板與委託狀態
      const [comments, setComments] = useState(DEFAULT_COMMENTS);
      const [commissions, setCommissions] = useState([]);
      
      // 留言表單
      const [boardName, setBoardName] = useState("");
      const [boardAvatar, setBoardAvatar] = useState("🐱");
      const [boardAura, setBoardAura] = useState("purple");
      const [boardText, setBoardText] = useState("");

      // 委託表單
      const [commName, setCommName] = useState("");
      const [commContact, setCommContact] = useState("");
      const [commBudget, setCommBudget] = useState("¥5,000 - ¥15,000");
      const [commType, setCommType] = useState("SFW 插圖委託");
      const [commDesc, setCommDesc] = useState("");
      const [commRefUrl, setCommRefUrl] = useState("");

      // 管理後台
      const [adminPassword, setAdminPassword] = useState("");
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
      const [showAdminPanel, setShowAdminPanel] = useState(false);
      const [discordWebhook, setDiscordWebhook] = useState("");

      const [toast, setToast] = useState(null);

      useEffect(() => {
        // 載入本地儲存
        const storedComments = localStorage.getItem("toynya_portal_comments");
        if (storedComments) setComments(JSON.parse(storedComments));
        
        const storedComms = localStorage.getItem("toynya_portal_comms");
        if (storedComms) setCommissions(JSON.parse(storedComms));

        const storedWebhook = localStorage.getItem("toynya_discord_webhook");
        if (storedWebhook) setDiscordWebhook(storedWebhook);
      }, []);

      const triggerToast = (msg, type = "success") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3000);
      };

      // 切換深色模式
      const toggleTheme = () => {
        setIsDark(!isDark);
        if (isDark) {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      };

      // 提交留言
      const handlePostComment = (e) => {
        e.preventDefault();
        if (!boardName.trim() || !boardText.trim()) {
          triggerToast("請填寫名字與留言內容！", "error");
          return;
        }
        const newComment = {
          id: Date.now(),
          name: boardName.trim(),
          avatar: boardAvatar,
          aura: boardAura,
          text: boardText.trim(),
          time: new Date().toLocaleDateString()
        };
        const updated = [newComment, ...comments];
        setComments(updated);
        localStorage.setItem("toynya_portal_comments", JSON.stringify(updated));
        setBoardText("");
        triggerToast("✨ 留言成功發佈！");
      };

      // 提交委託
      const handlePostCommission = async (e) => {
        e.preventDefault();
        if (!commName.trim() || !commContact.trim() || !commDesc.trim()) {
          triggerToast("請填寫名稱、聯繫方式與委託詳情！", "error");
          return;
        }

        const newComm = {
          id: Date.now(),
          name: commName.trim(),
          contact: commContact.trim(),
          budget: commBudget,
          type: commType,
          desc: commDesc.trim(),
          refUrl: commRefUrl.trim(),
          time: new Date().toLocaleString(),
          status: "待處理"
        };

        // 1. 本地儲存備份
        const updated = [newComm, ...commissions];
        setCommissions(updated);
        localStorage.setItem("toynya_portal_comms", JSON.stringify(updated));

        // 2. 發送 Discord Webhook (若有設定)
        if (discordWebhook.trim()) {
          try {
            const discordPayload = {
              username: "Toynya Portal 委託助手",
              avatar_url: "https://pbs.twimg.com/profile_images/1854183243857424384/VucjVbzu.jpg",
              embeds: [{
                title: `🎨 收到新的【${commType}】申請！`,
                color: 15073298, // #e60012
                fields: [
                  { name: "委託人名稱", value: newComm.name, inline: true },
                  { name: "聯繫方式", value: newComm.contact, inline: true },
                  { name: "預算範圍", value: commBudget, inline: true },
                  { name: "參考連結/附圖", value: commRefUrl.trim() ? commRefUrl.trim() : "無", inline: false },
                  { name: "委託詳細需求描述", value: newComm.desc, inline: false }
                ],
                footer: { text: `提交時間：${newComm.time}` }
              }]
            };

            await fetch(discordWebhook.trim(), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(discordPayload)
            });
            triggerToast("🎉 委託成功送出，且已推送至 Discord 實時通知！");
          } catch (err) {
            console.error("Webhook發送失敗:", err);
            triggerToast("委託已儲存於本地，但 Discord 通知推播失敗。", "warning");
          }
        } else {
          triggerToast("🔒 委託已安全、加密提交！只有 Toynya 老師能在後台管理查看。");
        }

        // 清空輸入
        setCommName("");
        setCommContact("");
        setCommDesc("");
        setCommRefUrl("");
      };

      // 管理登入
      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPassword === "toynya65535") {
          setIsAdminLoggedIn(true);
          triggerToast("🔑 管理權限認證成功！");
        } else {
          triggerToast("❌ 密碼錯誤，請重新輸入！", "error");
        }
      };

      const handleSaveWebhook = () => {
        localStorage.setItem("toynya_discord_webhook", discordWebhook.trim());
        triggerToast("💾 Discord Webhook 網址設定已儲存！");
      };

      const deleteCommission = (id) => {
        const filtered = commissions.filter(c => c.id !== id);
        setCommissions(filtered);
        localStorage.setItem("toynya_portal_comms", JSON.stringify(filtered));
        triggerToast("🗑️ 委託資料已刪除");
      };

      const deleteComment = (id) => {
        const filtered = comments.filter(c => c.id !== id);
        setComments(filtered);
        localStorage.setItem("toynya_portal_comments", JSON.stringify(filtered));
        triggerToast("🗑️ 留言已刪除");
      };

      return (
        <div className="relative min-h-screen flex flex-col justify-between">
          
          {/* 頂部氣泡背景 */}
          <div className={`absolute top-10 left-10 w-72 h-72 rounded-full blur-3xl bubble-1 z-0 ${isDark ? 'bg-purple-950/20' : 'bg-purple-200/20'}`}></div>
          <div className={`absolute bottom-20 right-20 w-96 h-96 rounded-full blur-[100px] bubble-2 z-0 ${isDark ? 'bg-cyan-950/15' : 'bg-cyan-200/20'}`}></div>

          {/* 浮動通知 */}
          {toast && (
            <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 px-5 py-3 rounded-xl border shadow-xl text-sm font-semibold transition-all duration-300 animate-in fade-in slide-in-from-top-4 ${
              toast.type === 'error' ? 'bg-red-500/10 border-red-500/30 text-red-400' :
              toast.type === 'warning' ? 'bg-amber-500/10 border-amber-500/30 text-amber-400' :
              'bg-emerald-500/10 border-emerald-500/30 text-emerald-400'
            }`}>
              {toast.type === 'error' ? <Icons.Warning className="w-5 h-5"/> : <Icons.Check className="w-5 h-5"/>}
              <span>{toast.msg}</span>
            </div>
          )}

          {/* 頂部 Header */}
          <header className="max-w-7xl w-full mx-auto px-4 sm:px-8 py-5 flex justify-between items-center z-10 relative">
            <div className="flex items-center gap-3">
              <span className="w-3 h-3 rounded-full bg-p5red animate-pulse shadow-[0_0_8px_#e60012]"></span>
              <span className="text-xs font-black uppercase tracking-widest bg-slate-900/40 dark:bg-white/5 border dark:border-white/10 border-slate-200 px-3 py-1 rounded-full backdrop-blur-md">
                Toynya Hub • Online
              </span>
            </div>
            
            <div className="flex items-center gap-3">
              <button 
                onClick={toggleTheme}
                className="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 hover:border-cyanblue/50 dark:hover:border-cyanblue/50 text-slate-600 dark:text-slate-300 hover:text-cyanblue shadow-sm backdrop-blur-md transition-all duration-300"
              >
                {isDark ? <Icons.Sun className="w-5 h-5"/> : <Icons.Moon className="w-5 h-5"/>}
              </button>
            </div>
          </header>

          {/* 主體區 */}
          <main className="max-w-7xl w-full mx-auto px-4 sm:px-8 pb-16 z-10 relative space-y-16">
            
            {/* 個人自傳卡 (Twitter 印象展示卡) */}
            <section className="w-full rounded-3xl p-6 sm:p-8 dark:bg-slate-950/60 bg-white/70 border dark:border-white/10 border-slate-200 shadow-xl backdrop-blur-xl transition-all duration-300 relative overflow-hidden">
              <div className="absolute top-0 right-0 w-48 h-48 bg-gradient-to-br from-p5red/10 to-transparent rounded-bl-full pointer-events-none"></div>
              
              <div className="flex flex-col md:flex-row gap-6 items-center">
                {/* 貓頭像 */}
                <div className="relative group shrink-0">
                  <div className="absolute -inset-1 rounded-full bg-gradient-to-r from-p5red via-hifiorange to-cyanblue opacity-75 blur-md group-hover:opacity-100 transition duration-1000 group-hover:duration-200 animate-pulse"></div>
                  <div className="relative w-28 h-24 rounded-full overflow-hidden border-4 dark:border-slate-950 border-white shadow-xl">
                    <img 
                      src="https://pbs.twimg.com/profile_images/1854183243857424384/VucjVbzu.jpg" 
                      alt="Toynya Avatar" 
                      className="w-full h-full object-cover"
                    />
                  </div>
                </div>

                {/* 資訊 */}
                <div className="flex-1 space-y-3 text-center md:text-left min-w-0">
                  <div className="flex flex-col md:flex-row md:items-center gap-2 md:gap-4 justify-center md:justify-start">
                    <h1 className="text-3xl font-black tracking-wider dark:text-white text-slate-900">Toynya</h1>
                    <div className="flex items-center gap-2 justify-center">
                      <a 
                        href="https://x.com/wanjumiao65535" 
                        target="_blank" 
                        className="text-xs font-bold dark:text-cyanblue text-cyan-600 hover:underline flex items-center gap-1 bg-cyanblue/10 px-3 py-1 rounded-full"
                      >
                        <Icons.Twitter className="w-4 h-4"/> @wanjumiao65535
                      </a>
                    </div>
                  </div>

                  <p className="text-sm dark:text-slate-300 text-slate-600 font-medium leading-relaxed max-w-4xl">
                    どうも～こちら可愛いケモノのキャラクターが好きなAIイラストレーターで、性別に関係なく可愛いなら好きです！ 
                    主にケモショタのAIイラストを投稿します。
                  </p>

                  {/* 創作流線 */}
                  <div className="pt-2">
                    <div className="text-[10px] uppercase font-black tracking-widest text-p5red mb-2">MODEL FLOW PIPELINE / 創作流線</div>
                    <div className="flex flex-wrap justify-center md:justify-start items-center gap-2 text-xs font-bold">
                      <span className="bg-slate-900/80 dark:bg-white/5 border dark:border-white/10 border-slate-200 px-3 py-1 rounded-lg">Midjourney (パーソナライズ)</span>
                      <Icons.ArrowRight className="text-slate-500" />
                      <span className="bg-slate-900/80 dark:bg-white/5 border dark:border-white/10 border-slate-200 px-3 py-1 rounded-lg">NovelAI (バイブトランスファー)</span>
                      <Icons.ArrowRight className="text-slate-500" />
                      <span className="bg-slate-900/80 dark:bg-white/5 border dark:border-white/10 border-slate-200 px-3 py-1 rounded-lg">Seaart (img2imgリファイナー)</span>
                      <Icons.ArrowRight className="text-slate-500" />
                      <span className="bg-slate-900/80 dark:bg-white/5 border dark:border-white/10 border-slate-200 px-3 py-1 rounded-lg">Photoshop加筆</span>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* 系統傳送門 - 4大子系統導航 */}
            <section className="space-y-6">
              <h2 className="text-lg font-black tracking-widest uppercase border-b-2 dark:border-white/10 border-slate-200 pb-3 flex items-center gap-2">
                <Icons.Sparkles className="text-p5red"/> Core Engines / 核心系統入口
              </h2>
              
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                
                {/* 系統 1: 聊天 RP 系統 */}
                <a 
                  href="/chat" 
                  className="group relative rounded-2xl p-6 dark:bg-slate-950/80 bg-white border dark:border-white/10 border-slate-200 hover:border-cyanblue/50 transition-all duration-300 shadow-md hover:shadow-[0_8px_30px_rgba(14,165,233,0.15)] overflow-hidden flex flex-col justify-between min-h-[190px]"
                >
                  <div className="absolute -top-10 -right-10 w-24 h-24 bg-cyanblue/5 group-hover:scale-150 transition-transform duration-500 rounded-full"></div>
                  <div>
                    <div className="w-12 h-12 rounded-xl bg-cyanblue/10 flex items-center justify-center text-cyanblue mb-4 group-hover:scale-110 transition-transform duration-300">
                      <Icons.Chat className="w-6 h-6"/>
                    </div>
                    <h3 className="text-lg font-black group-hover:text-cyanblue transition-colors">小酒館 RP 對話系統</h3>
                    <p className="text-xs dark:text-slate-400 text-slate-500 mt-2 font-medium leading-relaxed">
                      AI 擬真貓獸人正太語音對話。支援主導、小說模式與 4 大聲線切換。
                    </p>
                  </div>
                  <div className="text-xs font-bold text-cyanblue mt-4 flex items-center gap-1">
                    進入對話空間 <Icons.ArrowRight/>
                  </div>
                </a>

                {/* 系統 2: TRPG 單人跑團系統 */}
                <a 
                  href="/trpg" 
                  className="group relative rounded-2xl p-6 dark:bg-slate-950/80 bg-white border dark:border-white/10 border-slate-200 hover:border-p5red/50 transition-all duration-300 shadow-md hover:shadow-[0_8px_30px_rgba(230,0,18,0.15)] overflow-hidden flex flex-col justify-between min-h-[190px]"
                >
                  <div className="absolute -top-10 -right-10 w-24 h-24 bg-p5red/5 group-hover:scale-150 transition-transform duration-500 rounded-full"></div>
                  <div>
                    <div className="w-12 h-12 rounded-xl bg-p5red/10 flex items-center justify-center text-p5red mb-4 group-hover:scale-110 transition-transform duration-300">
                      <Icons.Dice className="w-6 h-6"/>
                    </div>
                    <h3 className="text-lg font-black group-hover:text-p5red transition-colors">單人 TRPG 跑團系統</h3>
                    <p className="text-xs dark:text-slate-400 text-slate-500 mt-2 font-medium leading-relaxed">
                      P5 叛逆紅黑風格冒險！特技代用判定、狂氣與戰鬥機制全面演算。
                    </p>
                  </div>
                  <div className="text-xs font-bold text-p5red mt-4 flex items-center gap-1">

                </a>

                {/* 系統 3: AI Prompt 終端 */}

                  className="group relative rounded-2xl p-6 dark:bg-slate-950/80 bg-white border dark:border-white/10 border-slate-200 hover:border-hifiorange/50 transition-all duration-300 shadow-md hover:shadow-[0_8px_30px_rgba(249,115,22,0.15)] overflow-hidden flex flex-col justify-between min-h-[190px]"
                >
                  <div className="absolute -top-10 -right-10 w-24 h-24 bg-hifiorange/5 group-hover:scale-150 transition-transform duration-500 rounded-full"></div>
                  <div>
                    <div className="w-12 h-12 rounded-xl bg-hifiorange/10 flex items-center justify-center text-hifiorange mb-4 group-hover:scale-110 transition-transform duration-300">

                    </p>
                  </div>

                {/* 系統 4: 個人 AI 小工具合集 */}

                  href="/tools"

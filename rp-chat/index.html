        // ===== 好感度狀態判定系統 =====
        const getAffectionInfo = (score, isDark) => {
            if (score <= 20) return { label: '初遇', color: isDark ? 'text-slate-300' : 'text-slate-600', bg: isDark ? 'bg-slate-800' : 'bg-slate-100', border: isDark ? 'border-slate-600' : 'border-slate-200' };
            if (score <= 40) return { label: '心動', color: isDark ? 'text-pink-300' : 'text-pink-600', bg: isDark ? 'bg-pink-950/50' : 'bg-pink-100', border: isDark ? 'border-pink-800/50' : 'border-pink-200' };
            if (score <= 60) return { label: '依戀', color: isDark ? 'text-rose-300' : 'text-rose-600', bg: isDark ? 'bg-rose-950/50' : 'bg-rose-100', border: isDark ? 'border-rose-800/50' : 'border-rose-200' };
            if (score <= 80) return { label: '相愛', color: isDark ? 'text-red-400' : 'text-red-600', bg: isDark ? 'bg-red-950/50' : 'bg-red-100', border: isDark ? 'border-red-800/50' : 'border-red-200' };
            if (score <= 99) return { label: '渴求', color: isDark ? 'text-fuchsia-400' : 'text-fuchsia-600', bg: isDark ? 'bg-fuchsia-950/50' : 'bg-fuchsia-100', border: isDark ? 'border-fuchsia-800/50' : 'border-fuchsia-200' };
            return { label: '淪陷', color: isDark ? 'text-purple-400' : 'text-purple-700', bg: isDark ? 'bg-purple-950/50' : 'bg-purple-100', border: isDark ? 'border-purple-800/50' : 'border-purple-300' };
        };

        // ===== 自定義語音播放器 Component =====
        const CustomAudioPlayer = ({ src, theme }) => {
            const audioRef = useRef(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [progress, setProgress] = useState(0);
            const [duration, setDuration] = useState(0);

            const togglePlay = () => {
                if (!audioRef.current) return;
                if (isPlaying) {
                    audioRef.current.pause();
                } else {
                    audioRef.current.play();
                }
                setIsPlaying(!isPlaying);
            };

            const handleTimeUpdate = () => {
                if (!audioRef.current) return;
                const current = audioRef.current.currentTime;
                const total = audioRef.current.duration || 0;
                setProgress(total > 0 ? (current / total) * 100 : 0);
            };

            const handleLoadedMetadata = () => {
                if (audioRef.current) {
                    setDuration(audioRef.current.duration);
                }
            };

            const handleSeek = (e) => {
                const value = e.target.value;
                if (audioRef.current && duration > 0) {
                    audioRef.current.currentTime = (value / 100) * duration;
                    setProgress(value);
                }
            };

            const formatTime = (time) => {
                if (isNaN(time) || !isFinite(time)) return "0:00";
                const m = Math.floor(time / 60);
                const s = Math.floor(time % 60);
                return `${m}:${s.toString().padStart(2, '0')}`;
            };

            const isLight = theme === 'light';

            return (
                <div className={`flex items-center gap-2.5 ${isLight ? 'bg-slate-100 border-cyan-200' : 'bg-slate-900/80 border-cyan-500/30'} border rounded-full p-1.5 pr-4 w-full max-w-[260px] sm:max-w-[280px] shadow-[0_2px_10px_rgba(6,182,212,0.1)] backdrop-blur-sm mt-3 relative overflow-hidden group`}>
                    <div className={`absolute inset-0 bg-cyan-500/10 transition-opacity duration-500 ${isPlaying ? 'opacity-100' : 'opacity-0'}`}></div>
                    
                    <audio 
                        ref={audioRef} 
                        src={src} 
                        onTimeUpdate={handleTimeUpdate} 
                        onLoadedMetadata={handleLoadedMetadata}
                        onEnded={() => setIsPlaying(false)}
                        className="hidden" 
                    />
                    
                    <button 
                        onClick={togglePlay} 
                        className="w-8 h-8 flex-shrink-0 flex items-center justify-center rounded-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 transition-all shadow-[0_0_10px_rgba(6,182,212,0.5)] z-10"
                    >
                        {isPlaying ? <Icons.Pause /> : <Icons.Play />}
                    </button>
                    
                    <div className="flex-1 flex items-center gap-2 z-10">
                        <span className={`text-[10px] ${isLight ? 'text-cyan-800' : 'text-cyan-100'} font-mono w-7 text-right`}>
                            {formatTime(audioRef.current?.currentTime || 0)}
                        </span>
                        
                        <div className="flex-1 relative flex items-center h-4 cursor-pointer">
                            <input 
                                type="range" 
                                min="0" 
                                max="100" 
                                value={progress || 0} 
                                onChange={handleSeek}
                                className="w-full h-1.5 bg-slate-700/50 rounded-full appearance-none outline-none z-20 cursor-pointer accent-cyan-400 [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:w-3 [&::-webkit-slider-thumb]:h-3 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-cyan-300 [&::-webkit-slider-thumb]:shadow-[0_0_8px_rgba(6,182,212,0.8)]"
                            />
                            <div 
                                className="absolute left-0 top-1/2 -translate-y-1/2 h-1.5 bg-cyan-500 rounded-full pointer-events-none z-10"
                                style={{ width: `${progress}%` }}
                            ></div>
                        </div>
                        
                        <span className={`text-[10px] ${isLight ? 'text-slate-500' : 'text-slate-400'} font-mono w-7`}>
                            {formatTime(duration)}
                        </span>
                    </div>
                </div>
            );
        };

        // ===== 圖片裁切器 Component =====
        const ImageCropper = ({ src, onCrop, onCancel, titleText = "手動調整裁切範圍" }) => {
            const containerRef = useRef(null);
            const imageRef = useRef(null);
            const [cropBox, setCropBox] = useState({ x: 0, y: 0, size: 200 });
            const [imgSize, setImgSize] = useState({ w: 0, h: 0 });
            const [isDragging, setIsDragging] = useState(false);
            const [dragStart, setDragStart] = useState({ x: 0, y: 0 });

            const onImgLoad = (e) => {
                const { width, height } = e.target;
                setImgSize({ w: width, h: height });
                const size = Math.min(width, height, 250);
                setCropBox({ x: (width - size) / 2, y: (height - size) / 2, size });
            };

            const handlePointerDown = (e) => {
                setIsDragging(true);
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                setDragStart({ x: clientX - cropBox.x, y: clientY - cropBox.y });
                e.preventDefault();
            };

            const handlePointerMove = useCallback((e) => {
                if (!isDragging) return;
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                
                let newX = clientX - dragStart.x;
                let newY = clientY - dragStart.y;
                
                newX = Math.max(0, Math.min(newX, imgSize.w - cropBox.size));
                newY = Math.max(0, Math.min(newY, imgSize.h - cropBox.size));
                
                setCropBox(prev => ({ ...prev, x: newX, y: newY }));
            }, [isDragging, dragStart, imgSize, cropBox.size]);

            const handlePointerUp = () => setIsDragging(false);

            useEffect(() => {
                if (isDragging) {
                    window.addEventListener('mousemove', handlePointerMove);
                    window.addEventListener('mouseup', handlePointerUp);
                    window.addEventListener('touchmove', handlePointerMove, { passive: false });
                    window.addEventListener('touchend', handlePointerUp);
                }
                return () => {
                    window.removeEventListener('mousemove', handlePointerMove);
                    window.removeEventListener('mouseup', handlePointerUp);
                    window.removeEventListener('touchmove', handlePointerMove);
                    window.removeEventListener('touchend', handlePointerUp);
                };
            }, [isDragging, handlePointerMove]);

            const handleSizeChange = (e) => {
                const newSize = parseInt(e.target.value);
                const maxAllowed = Math.min(imgSize.w - cropBox.x, imgSize.h - cropBox.y);
                const safeSize = Math.min(newSize, maxAllowed);
                setCropBox(prev => ({ ...prev, size: safeSize }));
            };

            const executeCrop = () => {
                if (!imageRef.current) return;
                const canvas = document.createElement('canvas');
                canvas.width = cropBox.size;
                canvas.height = cropBox.size;
                const ctx = canvas.getContext('2d');
                
                const scaleX = imageRef.current.naturalWidth / imgSize.w;
                const scaleY = imageRef.current.naturalHeight / imgSize.h;
                
                ctx.drawImage(
                    imageRef.current,
                    cropBox.x * scaleX,
                    cropBox.y * scaleY,
                    cropBox.size * scaleX,
                    cropBox.size * scaleY,
                    0, 0, cropBox.size, cropBox.size
                );
                onCrop(canvas.toDataURL('image/jpeg', 0.9));
            };

            return (
                <div className="fixed inset-0 z-[70] bg-black/90 flex flex-col items-center justify-center p-4">
                    <div className="text-white mb-4 font-bold tracking-widest text-sm flex items-center gap-2"><Icons.Image /> {titleText}</div>
                    <div ref={containerRef} className="relative select-none touch-none bg-slate-900 border border-white/10 rounded-lg overflow-hidden shadow-2xl max-w-full" style={{ maxHeight: '60vh' }}>
                        <img ref={imageRef} src={src} onLoad={onImgLoad} className="max-w-full max-h-[60vh] object-contain block pointer-events-none" draggable="false" />
                        
                        {imgSize.w > 0 && (
                            <>
                                <div className="absolute inset-0 bg-black/60 pointer-events-none" style={{ clipPath: `polygon(0% 0%, 0% 100%, 100% 100%, 100% 0%, 0% 0%, ${cropBox.x}px ${cropBox.y}px, ${cropBox.x + cropBox.size}px ${cropBox.y}px, ${cropBox.x + cropBox.size}px ${cropBox.y + cropBox.size}px, ${cropBox.x}px ${cropBox.y + cropBox.size}px, ${cropBox.x}px ${cropBox.y}px)` }}></div>

                                        );
                                    }

                                    const cleanDisplayText = (msg.sender === 'model' && activeDominantMode && !isScenarioMode) 
                                        ? filterOptionsTextForUI(msg.text) 
                                        : msg.text;

                                    let msgAvatar = currentRoleAvatar;
                                    let msgName = currentRoleName;
                                    if (msg.sender === 'model' && isScenarioMode && msg.roleId) {
                                        const activeRole = roles.find(r => r.id === msg.roleId);
                                        if (activeRole) {
                                            msgAvatar = activeRole.avatar;
                                            msgName = activeRole.name;
                                        }
                                    }

                                    return (
                                        <div key={msg.id} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'} group mb-4`}>
                                            {msg.sender === 'model' && (
                                                <div className="flex flex-col items-center mr-2 sm:mr-3">
                                                    {!isPureMode ? (
                                                        <>
                                                            <div className={`w-8 h-8 rounded-full overflow-hidden border flex-shrink-0 shadow-md bg-slate-800 ${isScenarioMode && msg.roleId === scenarioRoleAId ? 'border-fuchsia-400 shadow-[0_0_10px_rgba(217,70,239,0.4)]' : isScenarioMode && msg.roleId === scenarioRoleBId ? 'border-blue-400 shadow-[0_0_10px_rgba(56,189,248,0.4)]' : 'border-cyan-500/50'}`}>
                                                                <img src={msgAvatar} alt="Avatar" className="w-full h-full object-cover" />
                                                            </div>
                                                            {isScenarioMode && <span className="text-[9px] text-slate-400 mt-1 max-w-[45px] truncate text-center leading-tight">{msgName}</span>}
                                                        </>
                                                    ) : (
                                                        <div className={`w-8 h-8 rounded-full border flex-shrink-0 shadow-md bg-slate-800 border-cyan-500/50 flex items-center justify-center text-cyan-500`}>
                                                            <Icons.Sparkles />
                                                        </div>
                                                    )}
                                                </div>
                                            )}
                                            
                                            <div className={`flex flex-col ${msg.sender === 'user' ? 'items-end' : 'items-start'} max-w-[88%] sm:max-w-[85%] md:max-w-[75%]`}>
                                                <div className={`rounded-2xl p-3 sm:p-4 backdrop-blur-lg shadow-lg relative w-full ${
                                                    msg.sender === 'user' 
                                                        ? `${themeClasses.userBubble} rounded-tr-none border border-white/25` 
                                                        : `${themeClasses.modelBubble} rounded-tl-none`
                                                }`}>
                                                    {msg.imageUrl && (
                                                        <img src={msg.imageUrl} alt="Uploaded" onClick={() => setPreviewImageUrl(msg.imageUrl)} className="max-w-full max-h-48 sm:max-h-60 rounded-xl mb-3 border border-white/20 shadow-md cursor-pointer hover:opacity-90 transition-opacity" />
                                                    )}

                                                    <div className="whitespace-pre-wrap leading-relaxed text-[13px] md:text-sm relative z-10">
                                                        {renderMessageContent(cleanDisplayText)}
                                                    </div>

                                                    {msg.sender === 'model' && msg.generatedImages && msg.generatedImages.length > 0 && (
                                                        <div className="mt-3 space-y-3 relative z-10">
                                                            {msg.generatedImages.map((img, idx) => (
                                                                <div key={idx} className="relative group overflow-hidden rounded-xl">
                                                                    {img.isLoading ? (
                                                                        <div className={`w-full max-w-sm ${getAspectRatioClass(aspectRatio)} bg-slate-950/50 animate-pulse border border-fuchsia-500/20 flex items-center justify-center`}>
                                                                            <div className="flex flex-col items-center gap-2 text-fuchsia-400">
                                                                                <Icons.Image />
                                                                                <span className="text-[11px] font-semibold">{cgEngine === 'novelai' ? 'NovelAI' : 'Gemini'} 繪製中 ({aspectRatio})...</span>
                                                                            </div>
                                                                        </div>
                                                                    ) : img.url ? (
                                                                        <div className="max-w-sm">
                                                                            <img src={img.url} onClick={() => setPreviewImageUrl(img.url)} className={`w-full ${getAspectRatioClass(aspectRatio)} object-cover rounded-xl border border-white/20 shadow-md cursor-pointer hover:opacity-90 transition-opacity`} />
                                                                        </div>
                                                                    ) : img.failed ? (
                                                                        <div className={`w-full max-w-sm ${getAspectRatioClass(aspectRatio)} bg-red-950/20 border border-red-500/30 flex items-center justify-center rounded-xl`}>
                                                                            <div className="flex flex-col items-center gap-2 text-red-400/80">
                                                                                <Icons.Image />
                                                                                <span className="text-[11px] font-semibold">圖片生成超時或失敗</span>
                                                                            </div>
                                                                        </div>
                                                                    ) : null}
                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}
                                                    
                                                    {msg.sender === 'model' && msg.isAudioLoading && (
                                                        <div className="mt-3 pt-3 border-t border-cyan-500/20 flex items-center gap-2.5 text-[11px] text-cyan-500 font-medium relative z-10">
                                                            <div className="flex gap-[3px] items-end h-3">
                                                                <span className="w-[3px] h-full bg-cyan-400 rounded-sm animate-[pulse_1s_ease-in-out_infinite]"></span>
                                                                <span className="w-[3px] h-1/2 bg-cyan-400 rounded-sm animate-[pulse_1s_ease-in-out_0.2s_infinite]"></span>
                                                                <span className="w-[3px] h-3/4 bg-cyan-400 rounded-sm animate-[pulse_1s_ease-in-out_0.4s_infinite]"></span>
                                                                <span className="w-[3px] h-1/3 bg-cyan-400 rounded-sm animate-[pulse_1s_ease-in-out_0.6s_infinite]"></span>
                                                            </div>
                                                            <span className="animate-pulse">正在提取角色語音頻率...</span>
                                                        </div>
                                                    )}

                                                    {msg.sender === 'model' && msg.audioUrl && (
                                                        <div className="mt-1 relative z-10">
                                                            <CustomAudioPlayer src={msg.audioUrl} theme={uiTheme} />
                                                        </div>
                                                    )}

                                                    {msg.sender === 'model' && msg.sources && msg.sources.length > 0 && (
                                                        <div className={`mt-4 pt-3 border-t text-[11px] -mx-4 -mb-4 px-4 pb-3 rounded-b-2xl relative z-10 ${isDark ? 'border-emerald-500/20 text-emerald-200/80 bg-emerald-950/20' : 'border-emerald-200 text-emerald-700 bg-emerald-50'}`}>
                                                            <div className={`flex items-center gap-1.5 mb-1.5 font-semibold ${isDark ? 'text-emerald-400' : 'text-emerald-600'}`}><Icons.Globe /> 查閱了最新網路資料：</div>
                                                            <ul className="space-y-1">
                                                                {msg.sources.map((src, i) => (
                                                                    <li key={i} className="flex items-start truncate"><Icons.Link /><a href={src.uri} target="_blank" className={`underline truncate ${isDark ? 'hover:text-emerald-300' : 'hover:text-emerald-500'}`}>{src.title}</a></li>
                                                                ))}
                                                            </ul>
                                                        </div>
                                                    )}

                                                    {msg.sender === 'model' && activeDominantMode && !isScenarioMode && msg.id === messages[messages.length - 1]?.id && lastMsgOptions.length > 0 && (
                                                        <div className={`pt-3 flex flex-col gap-2 relative z-10 ${msg.sources && msg.sources.length > 0 ? 'mt-3 border-t border-emerald-500/20' : 'mt-4 border-t border-cyan-500/10'}`}>
                                                            <div className="text-[11px] text-cyan-500 flex items-center gap-1"><Icons.Sparkles /> 請選擇回應：</div>
                                                            {lastMsgOptions.map((opt, idx) => {
                                                                const optionBtnClasses = uiTheme === 'light'
                                                                    ? 'bg-slate-50 hover:bg-cyan-50 border-slate-200 hover:border-cyan-300 text-slate-700'
                                                                    : 'bg-cyan-950/45 hover:bg-cyan-500/20 border-cyan-500/30 hover:border-cyan-400 text-slate-200';
                                                                return (
                                                                    <button key={idx} onClick={() => handleOptionClick(opt)} className={`text-left w-full px-3 sm:px-4 py-2 border rounded-xl text-[13px] transition-all active:scale-[0.98] drop-shadow-md z-10 relative ${optionBtnClasses}`}>{opt}</button>
                                                                );
                                                            })}
                                                        </div>
                                                    )}
                                                </div>
                                                
                                                <div className={`flex gap-3 mt-1.5 px-2 opacity-50 hover:opacity-100 transition-opacity ${msg.sender === 'user' ? 'flex-row-reverse' : ''}`}>
                                                    {msg.sender === 'user' && (
                                                        <button onClick={() => !isLoading && handleEdit(msg.id)} disabled={isLoading} className="text-[11px] flex items-center gap-1 text-slate-400 hover:text-cyan-500 disabled:opacity-30 transition-colors"><Icons.Edit /> 編輯重發</button>
                                                    )}
                                                    <button onClick={() => handleCopy(msg.text, msg.id)} className="text-[11px] flex items-center gap-1 text-slate-400 hover:text-cyan-500 transition-colors">
                                                        {copiedId === msg.id ? <><Icons.Check /> 已複製</> : <><Icons.Copy /> 複製</>}
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })
                            )}

                            {isLoading && (
                                <div className="flex justify-start mb-4">
                                    {isScenarioMode ? (
                                        <div className="flex -space-x-3 mr-2 sm:mr-3 flex-shrink-0 mt-1 relative h-8">
                                            <div className="w-8 h-8 rounded-full overflow-hidden border border-fuchsia-400 shadow-md bg-slate-800 z-10 opacity-60 animate-pulse">
                                                <img src={roles.find(r=>r.id===scenarioRoleAId)?.avatar} className="w-full h-full object-cover" />
                                            </div>
                                            <div className="w-8 h-8 rounded-full overflow-hidden border border-blue-400 shadow-md bg-slate-800 z-0 opacity-60 animate-pulse" style={{ animationDelay: '0.5s' }}>
                                                <img src={roles.find(r=>r.id===scenarioRoleBId)?.avatar} className="w-full h-full object-cover" />
                                            </div>
                                        </div>
                                    ) : (
                                        <div className={`w-8 h-8 rounded-full flex-shrink-0 mt-1 shadow-md bg-slate-800 mr-2 sm:mr-3 ${isPureMode ? 'border border-cyan-500/50 flex items-center justify-center text-cyan-500' : 'overflow-hidden border border-white/10'}`}>
                                            {isPureMode ? <Icons.Sparkles /> : <img src={headerDisplayAvatar} className="w-full h-full object-cover opacity-50" />}
                                        </div>
                                    )}
                                    <div className={`border rounded-2xl rounded-tl-none p-3 sm:p-4 flex gap-1 items-center shadow-lg h-fit relative z-10 ${isDark ? 'bg-slate-900/60 border-white/10' : 'bg-white border-slate-200'}`}>
                                        <div className="w-1.5 h-1.5 sm:w-2 sm:h-2 bg-cyan-400 rounded-full animate-bounce [animation-delay:-0.3s]"></div>
                                        <div className="w-1.5 h-1.5 sm:w-2 sm:h-2 bg-cyan-400 rounded-full animate-bounce [animation-delay:-0.15s]"></div>
                                        <div className="w-1.5 h-1.5 sm:w-2 sm:h-2 bg-cyan-400 rounded-full animate-bounce"></div>
                                    </div>
                                </div>
                            )}
                            <div ref={messagesEndRef} />
                        </div>

                        {/* 預測對話建議 */}
                        {!activeDominantMode && suggestions.length > 0 && !isLoading && (
                            <div className={`px-4 sm:px-6 py-2 sm:py-3 flex gap-2 overflow-x-auto custom-scrollbar border-t bg-black/5 relative z-20`}>
                                {suggestions.map((suggestion, index) => {
                                    const btnClasses = uiTheme === 'light'
                                        ? 'bg-white hover:bg-slate-100 border-slate-200 text-slate-700 hover:border-cyan-400'
                                        : 'bg-slate-900/60 hover:bg-cyan-950/50 border-white/10 hover:border-cyan-400 text-slate-300';
                                    return (
                                        <button key={index} onClick={() => handleSendMessage(suggestion)} className={`whitespace-nowrap px-3 sm:px-4 py-1.5 sm:py-2 border text-[11px] sm:text-xs rounded-full transition-all flex items-center gap-1.5 sm:gap-2 backdrop-blur-md shadow-sm ${btnClasses}`}><Icons.Sparkles />{suggestion}</button>
                                    );
                                })}
                            </div>
                        )}

                        {/* 輸入控制面板 */}
                        <div className={`shrink-0 p-3 sm:p-4 backdrop-blur-md border-t z-20 relative ${themeClasses.footer}`}>
                            <div className="flex flex-wrap items-center gap-2 mb-2.5 px-1">
                                <button 
                                    onClick={() => { if (!isSpecialModeActive && !isScenarioMode && !isAutoImageMode) setEnableImageGen(!enableImageGen); }} 
                                    disabled={isSpecialModeActive || isScenarioMode || isAutoImageMode} 
                                    className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-[11px] sm:text-xs font-semibold transition-all ${
                                        isSpecialModeActive || isScenarioMode 
                                            ? (isDark ? 'opacity-50 cursor-not-allowed bg-slate-900/50 text-slate-500 border-white/5' : 'opacity-50 cursor-not-allowed bg-slate-200 text-slate-400 border-transparent')
                                            : (enableImageGen || isAutoImageMode) 
                                                ? `bg-fuchsia-500/20 ${isDark ? 'text-fuchsia-400 border-fuchsia-500/50 shadow-[0_0_12px_rgba(217,70,239,0.3)]' : 'text-fuchsia-600 border-fuchsia-300 shadow-sm'} border` 
                                                : (isDark ? 'bg-slate-900/85 text-slate-400 border border-white/10 hover:bg-white/10' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 shadow-sm')
                                    }`}
                                >
                                    <Icons.Image /> 附圖 {isAutoImageMode ? 'AUTO' : enableImageGen ? 'ON' : 'OFF'} {(isSpecialModeActive || isScenarioMode || isAutoImageMode) && <Icons.Lock />}
                                </button>
                                <button onClick={() => !isSpecialModeActive && !isScenarioMode && setEnableVoice(!enableVoice)} disabled={isSpecialModeActive || isScenarioMode} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-[11px] sm:text-xs font-semibold transition-all ${
                                    isSpecialModeActive || isScenarioMode 
                                        ? (isDark ? 'opacity-50 cursor-not-allowed bg-slate-900/50 text-slate-500 border-white/5' : 'opacity-50 cursor-not-allowed bg-slate-200 text-slate-400 border-transparent')
                                        : enableVoice 
                                            ? `bg-green-500/20 ${isDark ? 'text-green-500 border-green-500/50 shadow-[0_0_12px_rgba(34,197,94,0.3)]' : 'text-green-700 border-green-300 shadow-sm'} border` 
                                            : (isDark ? 'bg-slate-900/85 text-slate-400 border border-white/10 hover:bg-white/10' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 shadow-sm')
                                }`}>
                                    <Icons.VolumeUp /> 語音 {enableVoice ? 'ON' : 'OFF'} {(isSpecialModeActive || isScenarioMode) && <Icons.Lock />}
                                </button>
                                
                                <button 
                                    onClick={handleExpandText}
                                    disabled={isExpanding}
                                    className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-[11px] sm:text-xs font-semibold transition-all border shadow-sm ${
                                        isExpanding 
                                            ? 'bg-amber-500/20 text-amber-500 border-amber-500/50 animate-pulse'
                                            : isDark
                                                ? 'bg-slate-900/80 text-slate-400 border-white/10 hover:bg-white/10'
                                                : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100'
                                    }`}
                                >
                                    {isExpanding ? (
                                        <>
                                            <span className="animate-spin"><Icons.Wand /></span>
                                            正在擴寫中...
                                        </>
                                    ) : (
                                        <>
                                            <Icons.Wand />
                                            靈感擴寫
                                        </>
                                    )}
                                </button>
                            </div>

                            {imageDataUrl && (
                                <div className="mb-3 relative inline-block">
                                    <img src={imageDataUrl} className="h-16 sm:h-20 rounded-lg border border-cyan-500/30 shadow-md" />
                                    <button onClick={removeImage} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 hover:bg-red-600 shadow-md"><Icons.X /></button>
                                </div>
                            )}

                            {/* 文字輸入主要面板 */}
                            <div className={`flex items-end gap-1.5 sm:gap-2 p-1.5 sm:p-2 rounded-2xl border transition-all shadow-inner ${themeClasses.input}`}>
                                <button onClick={() => setEnableSearch(!enableSearch)} className={`p-2.5 sm:p-3 rounded-xl transition-all relative ${enableSearch ? 'bg-emerald-500/20 text-emerald-500 border border-emerald-500/30' : 'text-slate-400 hover:bg-black/5 dark:hover:bg-white/5 border border-transparent'}`}>
                                    <Icons.Search />
                                    {enableSearch && <span className="absolute -top-1 -right-1 flex h-3.5 w-3.5"><span className="animate-ping absolute h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span className="relative inline-flex rounded-full h-3.5 w-3.5 bg-emerald-500 text-[8px] items-center justify-center font-bold text-slate-950">ON</span></span>}
                                </button>
                                <input type="file" accept="image/*" className="hidden" ref={fileInputRef} onChange={handleImageUpload} />
                                <button onClick={triggerFileInput} className="p-2.5 sm:p-3 text-slate-400 hover:text-cyan-500 dark:hover:text-cyan-400 hover:bg-black/5 dark:hover:bg-white/5 rounded-xl transition-colors"><Icons.Image /></button>
                                <textarea value={inputValue} onChange={(e) => setInputValue(e.target.value)} onKeyDown={handleKeyDown} placeholder={isScenarioMode ? "在情景空間中輸入您的行動或對話..." : "輸入訊息... (Shift + Enter 換行)"} className="flex-1 max-h-32 min-h-[40px] bg-transparent resize-none outline-none py-2.5 px-2 text-sm custom-scrollbar text-current placeholder-current opacity-90" rows="1" />
                                <button onClick={() => { if (inputValue.trim() || imageDataUrl) handleSendMessage(inputValue, imageDataUrl); }} disabled={isLoading || (!inputValue.trim() && !imageDataUrl)} className="p-2.5 sm:p-3 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white rounded-xl disabled:opacity-40 shadow-[0_0_15px_rgba(6,182,212,0.3)]"><Icons.Send /></button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

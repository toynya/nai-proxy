<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>單人跑團TRPG 系統</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --p5-red: #e60012;
      --p5-black: #050505;
      --p5-dark: #121212;
    }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--p5-black);
      background-image: repeating-linear-gradient(45deg, #080808 0, #080808 2px, transparent 2px, transparent 8px);
      color: #fff;
    }
    
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: var(--p5-black); border-left: 2px solid #333; }
    ::-webkit-scrollbar-thumb { background: var(--p5-red); border: 2px solid var(--p5-black); }
    ::-webkit-scrollbar-thumb:hover { background: #ff1a2e; }
    
    .custom-scrollbar::-webkit-scrollbar { width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: var(--p5-dark); border-left: 1px solid #333; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--p5-red); }

    .p5-skew { transform: skewX(-10deg); }
    .p5-unskew { transform: skewX(10deg); }
    .p5-shadow-red { box-shadow: 6px 6px 0px 0px var(--p5-red); }
    .p5-shadow-white { box-shadow: 6px 6px 0px 0px #fff; }
    .p5-shadow-black { box-shadow: 6px 6px 0px 0px var(--p5-black); }
    
    .p5-btn {
      position: relative;
      background-color: var(--p5-red);
      color: white;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 0.1em;
      border: 3px solid transparent;
      transition: all 0.15s ease-out;
      transform: skewX(-5deg);
    }
    .p5-btn:hover:not(:disabled) {
      background-color: white;
      color: var(--p5-black);
      border-color: var(--p5-black);
      box-shadow: 6px 6px 0px 0px var(--p5-red);
      transform: skewX(-5deg) translate(-2px, -2px);
    }
    .p5-btn:disabled { opacity: 0.5; filter: grayscale(1); cursor: not-allowed; }
    .p5-btn-content { transform: skewX(5deg); display: flex; align-items: center; justify-content: center; }

    .p5-heading {
      background: var(--p5-red);
      color: white;
      display: inline-block;
      padding: 0.25rem 1rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transform: skewX(-10deg);
      border: 2px solid var(--p5-black);
      box-shadow: 4px 4px 0px 0px #fff;
    }

    .p5-panel {
      background: var(--p5-dark);
      border: 3px solid #333;
      position: relative;
    }
    .p5-panel:before {
      content: '';
      position: absolute;
      top: -3px; left: -3px;
      width: 20px; height: 20px;
      border-top: 3px solid var(--p5-red);
      border-left: 3px solid var(--p5-red);
    }
    
    .p5-input {
      background: #000;
      border: 2px solid #444;
      color: white;
      font-weight: bold;
      transition: all 0.2s;
    }
    .p5-input:focus {
      border-color: var(--p5-red);
      outline: none;
      box-shadow: 4px 4px 0px 0px var(--p5-red);
    }

    .bg-pattern-dots {
      background-image: radial-gradient(#333 1px, transparent 1px);
      background-size: 16px 16px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const LucideIcon = ({ icon, className }) => <i className={`ph ph-${icon} ${className}`}></i>;
    const Send = ({className}) => <LucideIcon icon="paper-plane-tilt" className={className}/>;
    const Dices = ({className}) => <LucideIcon icon="dice-five" className={className}/>;
    const User = ({className}) => <LucideIcon icon="user" className={className}/>;
    const Upload = ({className}) => <LucideIcon icon="upload-simple" className={className}/>;
    const AlertCircle = ({className}) => <LucideIcon icon="warning-circle" className={className}/>;
    const Play = ({className}) => <LucideIcon icon="play" className={className}/>;
    const FileText = ({className}) => <LucideIcon icon="file-text" className={className}/>;
    const Heart = ({className}) => <LucideIcon icon="heart" className={className}/>;
    const Shield = ({className}) => <LucideIcon icon="shield" className={className}/>;
    const BookOpen = ({className}) => <LucideIcon icon="book-open" className={className}/>;
    const ImageIcon = ({className}) => <LucideIcon icon="image" className={className}/>;
    const Settings = ({className}) => <LucideIcon icon="gear" className={className}/>;
    const Brain = ({className}) => <LucideIcon icon="brain" className={className}/>;
    const Activity = ({className}) => <LucideIcon icon="activity" className={className}/>;
    const FilePlus = ({className}) => <LucideIcon icon="file-plus" className={className}/>;
    const Package = ({className}) => <LucideIcon icon="package" className={className}/>;
    const Zap = ({className}) => <LucideIcon icon="lightning" className={className}/>;
    const Menu = ({className}) => <LucideIcon icon="list" className={className}/>;
    const X = ({className}) => <LucideIcon icon="x" className={className}/>;
    const Info = ({className}) => <LucideIcon icon="info" className={className}/>;
    const Swords = ({className}) => <LucideIcon icon="sword" className={className}/>;
    const Download = ({className}) => <LucideIcon icon="download-simple" className={className}/>;
    const Maximize2 = ({className}) => <LucideIcon icon="arrows-out" className={className}/>;
    const Users = ({className}) => <LucideIcon icon="users" className={className}/>;
    const Cpu = ({className}) => <LucideIcon icon="cpu" className={className}/>;

    const apiKey = "";
    const PROXY_BASE_URL = 'https://nai-proxy-ten.vercel.app/api';

    const BUILTIN_SCENARIO = `他們進入到未知的世界的瑟瑟迷宮中，
    他們在隱藏房間迷了路，
    需要完成房間上的指示進行交尾才能離開房間。
`;

    const FIELDS = ["暴力", "情動", "知覺", "技術", "知識", "怪異"];
    const INSANE_SKILLS_GRID = [
      ["焚燒", "拷問", "束縛", "威脅", "破壞", "毆打", "切斷", "突刺", "射擊", "戰爭", "埋葬"],
      ["戀心", "愉悅", "陰鬱", "自知", "歡笑", "隱忍", "驚愕", "憤怒", "怨恨", "傷悲", "熱愛"],
      ["痛楚", "官能", "觸感", "嗅覺", "味道", "聆聽", "情景", "追蹤", "藝術", "直覺", "搜索"],
      ["分解", "電子機器", "整理", "藥品", "效率", "媒體", "攝像", "駕駛", "機械", "陷阱", "兵器"],
      ["物理", "數學", "化學", "生物", "醫學", "常識", "人類學", "歷史", "民俗學", "考古學", "天文學"],
      ["時間", "混沌", "深海", "死亡", "靈魂", "魔術", "暗黑", "終結", "夢境", "地底", "宇宙"]
    ];

    const ALL_SKILLS = INSANE_SKILLS_GRID.reduce((acc, val) => acc.concat(val), []);

    const cleanSkillStr = (str) => {
      if (!str) return '';
      return str.replace(/\[.*?\]\s*/g, '').trim(); 
    };

    const getSkillInfo = (skillNameRaw) => {
      const skillName = cleanSkillStr(skillNameRaw);
      if (!skillName || skillName === '無' || skillName === '') return { field: '未知', col: 0, value: 5, row: 0, exactName: '' };
      for (let c = 0; c < 6; c++) {
        for (let r = 0; r < 11; r++) {
          if (INSANE_SKILLS_GRID[c][r] === skillName) {
            return { field: FIELDS[c], col: c, value: r + 2, row: r, exactName: skillName };
          }
        }
      }
      return { field: '未知', col: 0, value: 5, row: 0, exactName: skillName };
    };

    const formatSkill = (skillName) => {
      if (!skillName || skillName.trim() === '' || skillName === '無') return '';
      const info = getSkillInfo(skillName);
      if (info.field === '未知') return `[未知] ${skillName}`;
      return `[${info.field} ${info.value}] ${info.exactName}`;
    };

    const calculateTargetDetailed = (requiredSkill, playerSkill, curiosityField) => {
      const req = getSkillInfo(requiredSkill);
      const play = getSkillInfo(playerSkill);
      
      if (req.exactName && req.exactName === play.exactName && req.field !== '未知') {
        return { target: 5, details: '5 (完全符合要求，無需代用距離計算)' };
      }
      if (req.field === '未知' || play.field === '未知') {
        return { target: 5, details: '5 (特技解析異常，預設以基礎值 5 計算)' };
      }

      const minCol = Math.min(req.col, play.col);
      const maxCol = Math.max(req.col, play.col);
      const curIndex = FIELDS.indexOf(curiosityField);
      
      let colGap = 0;
      let curBonus = 0;

      for (let i = minCol; i < maxCol; i++) {
        if (i === curIndex || i + 1 === curIndex) {
          curBonus++;
        } else {
          colGap++;
        }
      }
      
      const rowGap = Math.abs(req.row - play.row);
      const target = 5 + colGap + rowGap;
      const detailStr = `5(基礎) + 橫向差距 ${colGap}(原${maxCol-minCol},受好奇心減免${curBonus}) + 縱向差距 ${rowGap} = ${target}`;
      
      return { target, details: detailStr };
    };

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    async function fetchWithRetry(apiCall, maxRetries = 5) {
      const delays = [1000, 2000, 4000, 8000, 16000];
      for (let i = 0; i < maxRetries; i++) {
        try { return await apiCall(); } 
        catch (error) { if (i === maxRetries - 1) throw error; await sleep(delays[i]); }
      }
    }

    async function generateText(prompt, systemInstruction, schema = null, base64Image = null, aiConfig = null) {
      const parts = [{ text: prompt }];
      if (base64Image) {
        const match = base64Image.match(/data:(.*?);base64,(.*)/);
        if (match) parts.push({ inlineData: { mimeType: match[1], data: match[2] } });
      }

      parts[0].text += `\n\n【嚴格系統指令】：請務必回傳完整的 JSON。必須提供 3~4 個選項！如果選項是純劇情或特定條件，skill 欄位請務必填寫空字串 ""。若為特技判定，skill 必須是 66 種標準特技之一。絕對不可填寫未知特技。`;

      const payload = {
        contents: [{ role: "user", parts }],
        systemInstruction: { parts: [{ text: systemInstruction }] },
        generationConfig: { temperature: 0.7 }
      };
      
      if (schema) {
        payload.generationConfig.responseMimeType = "application/json";
        payload.generationConfig.responseSchema = schema;
      }

      let endpointUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
      let headers = { 'Content-Type': 'application/json' };
      let fetchBodyData = payload;

      if (aiConfig) {
        // 使用指定的預設模型
        const modelName = aiConfig.model || 'gemini-2.5-flash-preview-09-2025';
        
        if (aiConfig.provider === 'gcp') {
          if (!aiConfig.gcpCreds || !aiConfig.gcpCreds.jsonObject) {
              throw new Error("請先上傳 GCP 服務帳號 JSON 檔案。");
          }
          
          const region = aiConfig.gcpRegion || 'global';
          const creds = aiConfig.gcpCreds.jsonObject;
          const projectId = creds.project_id;
          
          const domain = (region === 'global') 
              ? 'aiplatform.googleapis.com' 
              : `${region}-aiplatform.googleapis.com`;

          const targetUrl = `https://${domain}/v1/projects/${projectId}/locations/${region}/publishers/google/models/${modelName}:generateContent`;

          endpointUrl = `https://nai-proxy-ten.vercel.app/api/gemini`;
          headers = { 'Content-Type': 'application/json' };
          
          fetchBodyData = {
              credentials: {
                  client_email: creds.client_email,
                  private_key: creds.private_key,
                  project_id: creds.project_id,
                  ...creds 
              },
              geminiPayload: payload,
              targetUrl: targetUrl,
              region: region,
              model: modelName
          };
          
        } else {
          // AI Studio：不填 key 時預設使用畫布內建的 apiKey=""
          const key = aiConfig.aiStudioKey || apiKey;
          endpointUrl = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${key}`;
          fetchBodyData = payload;
        }
      }
      
      const apiCall = async () => {
        console.log("🚀 發送 API 請求 -> Endpoint:", endpointUrl);

        const response = await fetch(endpointUrl, {
          method: 'POST', 
          headers: headers, 
          body: JSON.stringify(fetchBodyData)
        });
        
        if (!response.ok) {
            const errText = await response.text();
            throw new Error(`API 拒絕請求 (HTTP ${response.status}) - ${errText}`);
        }
        
        const responseText = await response.text();
        let data;
        try {
            data = JSON.parse(responseText);
        } catch (e) {
            console.error("❌ 後端回傳了非 JSON 的內容:", responseText);
            throw new Error(`伺服器錯誤 (無法解析 JSON)。內容摘要: ${responseText.substring(0, 80)}...`);
        }
        
        const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!text) throw new Error("API 返回了空結果，請確認回傳格式是否符合規格。");
        if (!schema) return text;

        try {
          let cleanText = text.trim();
          const firstBrace = cleanText.indexOf('{');
          const lastBrace = cleanText.lastIndexOf('}');
          if (firstBrace !== -1 && lastBrace !== -1) { cleanText = cleanText.substring(firstBrace, lastBrace + 1); }
          return JSON.parse(cleanText);
        } catch (e) { throw new Error("JSON 格式解析失敗，AI 回傳了意外的格式。"); }
      };
      
      return fetchWithRetry(apiCall);
    }

    async function generateImage(imgPromptObj, pcBaseUrl, npcBaseUrl, settings) {
      const parts = [];
      let promptText = `[Image-to-Image Mode] 動漫視覺小說風格插圖。高品質，傑作。絕無文字、無對話框、無字母、無UI (NO text, NO letters, NO words, NO dialogue boxes, NO watermarks, pure illustration only). Use the provided reference images directly for character designs. `;
      
      if (imgPromptObj.sceneTags) promptText += `Scene Environment: ${imgPromptObj.sceneTags}。`;
      if (imgPromptObj.presentPC) promptText += `[Character 1]: ${imgPromptObj.pcTags}。`;
      if (imgPromptObj.presentNPC) promptText += `[Character 2]: ${imgPromptObj.npcTags}。`;

      parts.push({ text: promptText });

      if (imgPromptObj.presentPC && pcBaseUrl) {
          const match = pcBaseUrl.match(/data:(.*?);base64,(.*)/);
          if (match) parts.push({ inlineData: { mimeType: match[1], data: match[2] } });
      }
      if (imgPromptObj.presentNPC && npcBaseUrl) {
          const match = npcBaseUrl.match(/data:(.*?);base64,(.*)/);
          if (match) parts.push({ inlineData: { mimeType: match[1], data: match[2] } });
      }
      
      const payload = {
        contents: [{ role: "user", parts: parts }],
        generationConfig: { 
          responseModalities: ["IMAGE", "TEXT"],
          imageConfig: { aspectRatio: settings.aspectRatio, imageSize: settings.imageSize }
        }
      };
      
      const apiCall = async () => {
        // 使用指定的預設圖像模型，預設同樣不提供 key，使用畫布注入
        const modelName = settings.model || 'gemini-2.5-flash-image-preview';
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });
        if (!response.ok) throw new Error(`HTTP ${response.status} 錯誤`);
        const data = await response.json();
        const inlineData = data.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData;
        if (!inlineData) throw new Error(`無法生成圖片資料`);
        return `data:${inlineData.mimeType};base64,${inlineData.data}`;
      };
      return fetchWithRetry(apiCall);
    }

    function ImageLightbox({ src, onClose }) {
      if (!src) return null;
      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/95 backdrop-blur-sm p-4 md:p-8 animate-in fade-in duration-200">
          <button onClick={onClose} className="absolute top-4 right-4 text-white hover:text-[#e60012] bg-[#111] border-2 border-white p-2 rounded-none transition p5-shadow-white"><X className="w-6 h-6" /></button>
          <a href={src} download="scene_cg.png" className="absolute top-4 right-20 text-black hover:bg-[#e60012] hover:text-white bg-white border-2 border-black p-2 rounded-none transition flex items-center gap-2 p5-shadow-red"><Download className="w-6 h-6" /></a>
          <img src={src} alt="Enlarged CG" className="max-w-full max-h-full object-contain shadow-2xl border-4 border-white p5-shadow-red" />
        </div>
      );
    }

    function CharacterSheetContent({ player, npcEnabled, npc, useAbility, useItem, loading, pendingRoll, combatState }) {
      const safeSkills = player.stats?.skills || [];
      const safeAbilities = player.stats?.abilities || [];
      const safeInventory = player.inventory || [];
      const safeMadness = player.madness || [];

      return (
        <div className="p-4 space-y-6 text-sm pb-10 bg-pattern-dots">
          <div className="flex items-center space-x-3 border-b-4 border-[#333] pb-4">
            {player.image && <img src={player.image} alt="PC" className="w-16 h-16 object-cover border-2 border-white p5-shadow-red" />}
            <div>
              <div className="text-[10px] bg-[#e60012] text-white font-black tracking-widest px-2 py-0.5 inline-block transform skew-x-[10deg] mb-1 shadow-[2px_2px_0px_#fff]">PLAYER</div>
              <h3 className="font-black text-white text-lg tracking-widest uppercase">{player.name}</h3>
              <p className="text-xs text-neutral-400 mt-1 font-bold">{player.stats?.occupation || '未知職業'} • {player.stats?.age || '?'}歲</p>
            </div>
          </div>
          
          {npcEnabled && (
             <div className="flex items-center space-x-3 border-b-4 border-[#333] pb-4">
               {npc.image ? <img src={npc.image} alt="NPC" className="w-14 h-14 object-cover border-2 border-neutral-500 opacity-90 p5-shadow-black" /> : <div className="w-14 h-14 bg-black border-2 border-neutral-600 flex items-center justify-center opacity-80"><Users className="w-6 h-6 text-neutral-500"/></div>}
               <div>
                 <div className="text-[10px] bg-blue-600 text-white font-black tracking-widest px-2 py-0.5 inline-block transform skew-x-[10deg] mb-1 shadow-[2px_2px_0px_#fff]">COMPANION</div>
                 <h3 className="font-black text-white text-base tracking-widest uppercase">{npc.name || '未命名 NPC'}</h3>
                 <p className="text-xs text-neutral-500 mt-1 line-clamp-1 font-bold">{npc.intro || '無簡介'}</p>
               </div>
             </div>
          )}

          <div className="p5-panel p-4 space-y-4">
            <div>
              <div className="flex justify-between text-xs mb-1 font-black uppercase"><span className="text-[#e60012] flex items-center"><Activity className="w-4 h-4 mr-1"/> HP</span><span className="text-white">{player.life} / {player.maxLife}</span></div>
              <div className="w-full bg-[#222] h-3 border-2 border-black rounded-none"><div className="bg-[#e60012] h-full transition-all" style={{ width: `${(player.life / player.maxLife) * 100}%` }}></div></div>
            </div>
            <div>
              <div className="flex justify-between text-xs mb-1 font-black uppercase"><span className="text-blue-500 flex items-center"><Brain className="w-4 h-4 mr-1"/> SAN</span><span className="text-white">{player.sanity} / {player.maxSanity}</span></div>
              <div className="w-full bg-[#222] h-3 border-2 border-black rounded-none"><div className="bg-blue-500 h-full transition-all" style={{ width: `${(player.sanity / player.maxSanity) * 100}%` }}></div></div>
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3 text-xs font-bold">
            <div className="bg-black p-3 border-2 border-[#333] shadow-[3px_3px_0px_#e60012] flex flex-col items-center justify-center">
              <span className="text-neutral-500 mb-1 uppercase tracking-wider text-[10px]">好奇心領域</span>
              <span className="text-green-400 text-sm">{player.stats?.curiosity || '無'}</span>
            </div>
            <div className="bg-black p-3 border-2 border-[#333] shadow-[3px_3px_0px_#e60012] flex flex-col items-center justify-center">
              <span className="text-neutral-500 mb-1 uppercase tracking-wider text-[10px]">恐怖心特技</span>
              <span className="text-purple-400 text-sm">{cleanSkillStr(player.stats?.fear) || '無'}</span>
            </div>
          </div>

          <div>
            <span className="text-white text-xs font-black uppercase tracking-widest block mb-3 border-b-2 border-red-600 pb-1">SKILLS / 特技</span>
            <div className="grid grid-cols-1 gap-2">
              {safeSkills.map((skill, idx) => (
                <div key={idx} className="bg-black px-3 py-2 text-xs text-white border-2 border-[#444] font-bold flex justify-between transform skew-x-[-5deg] hover:border-[#e60012] transition-colors">
                  <span className="transform skew-x-[5deg]">{formatSkill(skill)}</span>
                </div>
              ))}
            </div>
          </div>

          <div>
            <span className="text-white text-xs font-black uppercase tracking-widest block mb-3 border-b-2 border-yellow-600 pb-1 flex items-center"><Zap className="w-4 h-4 mr-1 text-yellow-500"/> ABILITIES / 異能</span>
            <div className="space-y-3">
              {safeAbilities.map((ab, idx) => (
                <div key={idx} className="bg-[#1a1a1a] p-3 border-l-4 border-yellow-500 flex flex-col items-start shadow-[3px_3px_0px_#000]">
                  <div className="flex justify-between w-full mb-2 items-center">
                    <span className="font-black text-yellow-500 text-sm">{ab.name}</span>

          if (imgPromptObj.presentPC && imgPromptObj.presentNPC && pcX === npcX && pcY === npcY) {
              pcX = Math.min(1, pcX + 0.2);
              npcX = Math.max(0, npcX - 0.2);
          }

          if (imgPromptObj.presentPC) {
             let parsedPcTags = imgPromptObj.pcTags ? `, ${imgPromptObj.pcTags}` : '';
             p_char_captions.push({
                 char_caption: `${naiSettings.v4PcPos}${parsedPcTags}`,
                 centers: [{ x: pcX, y: pcY }]
             });
             n_char_captions.push({
                 char_caption: naiSettings.v4PcNeg || "",
                 centers: [{ x: pcX, y: pcY }]
             });
          }
          if (imgPromptObj.presentNPC && npcEnabled) {
             let parsedNpcTags = imgPromptObj.npcTags ? `, ${imgPromptObj.npcTags}` : '';

                 char_caption: `${naiSettings.v4NpcPos}${parsedNpcTags}`,
                 centers: [{ x: npcX, y: npcY }]
             });

                 char_caption: naiSettings.v4NpcNeg || "",

             });

          let baseTags = imgPromptObj.sceneTags ? `, ${imgPromptObj.sceneTags}` : '';

          parameters.v4_prompt = {
            caption: { 
              base_caption: `${naiSettings.v4BasePos}${baseTags}`, 
              char_captions: p_char_captions

            use_order: true, 
            legacy_uc: false

              base_caption: naiSettings.v4BaseNeg || "", 
              char_captions: n_char_captions 
            },
            use_coords: false, 
            use_order: false, 
            legacy_uc: false
          };
          
          fullPayloadPrompt = parameters.v4_prompt.caption.base_caption; 
        } else {
          parameters.sm = naiSettings.smea;
          parameters.sm_dyn = naiSettings.smeaDyn;
          parameters.negative_prompt = naiSettings.negativePrompt;

                    pcTags: { type: "STRING", description: "【重要】絕對不要包含角色原有基礎特徵，僅填寫該角色在此情景中的表情、動作姿勢、替代服裝、配飾、互動物品等動態非情景英文 Tags。" }, 
                    pcCoords: { type: "OBJECT", properties: { x: { type: "NUMBER" }, y: { type: "NUMBER" } }, description: "PC的畫面座標(0~1)，預設0.5。x越大越靠左，y越大越靠上。" },
                    presentNPC: { type: "BOOLEAN" }, 
                    npcTags: { type: "STRING", description: "【重要】絕對不要包含角色原有基礎特徵，僅填寫該角色在此情景中的表情、動作姿勢、替代服裝、配飾、互動物品等動態非情景英文 Tags。" },
                    npcCoords: { type: "OBJECT", properties: { x: { type: "NUMBER" }, y: { type: "NUMBER" } }, description: "NPC的畫面座標(0~1)，與PC同場時不能完全相同。" }
                }
            },
            sanityChange: { type: "INTEGER", description: "預設必須為 0！" }, lifeChange: { type: "INTEGER", description: "預設為 0！" },
            newMadness: { type: "STRING", description: "獲得的具體狂氣名稱，無則留空。" }, removeMadness: { type: "STRING", description: "要移除的狂氣名稱（若有），無則留空。" },
            options: {
              type: "ARRAY", description: "提供 3 到 4 個選項",
              items: {
                type: "OBJECT",
                properties: {
                  type: { type: "STRING", description: "填寫：純劇情、特技判定、特定條件、戰鬥觸發" },
                  text: { type: "STRING" }, skill: { type: "STRING" }, combatSkill2: { type: "STRING" },
                  consequences: { type: "STRING" }, conditionLabel: { type: "STRING" }
                }
              }
            }
          },
          required: ["narration", "sanityChange", "lifeChange", "options"]
        };

        const gmSystemInstruction = `
          你是《INSANE》繁體中文版 AI GM。
          【極度重要：特技強制規定】：選項中的 skill 與 combatSkill2 欄位【絕對只能】填寫空字串 "" 或以下 66 個字詞之一，嚴禁發明新特技：${ALL_SKILLS.join(', ')}
          【禁止擅自扣血/理智/發放狂氣】：除了結算玩家骰子失敗的後果，或是系統已主動告知發放了狂氣，你在劇情敘述中絕對不可擅自扣除玩家的生命值與理智值，也不可重複發放狂氣！
          【圖片生成指示】：當你需要生成過場 CG 時，請在 imagePrompt 設定 generateCG: true，嚴格遵守場景(sceneTags)和各別動態角色特徵(pcTags, npcTags)分離，並指定 pcCoords 與 npcCoords (0~1) 控制站位偏移。
        `;

        try {
          const safeHistory = chatHistory || [];
          const chatContext = safeHistory.filter(m => m.text).slice(-8).map(msg => `${msg.role === 'gm' ? 'GM' : 'Player'}: ${msg.text}`).join('\n');
          let prompt = isInitial ? userActionText : `歷史對話:\n${chatContext}\n\n系統/玩家輸入: ${userActionText}`;
          
          const res = await generateText(prompt, gmSystemInstruction, gmSchema, player.image, textAiSettings); 

          setPlayer(prev => {
            let currentMadness = [...(prev.madness || [])];
            if (res.removeMadness && res.removeMadness.trim()) currentMadness = currentMadness.filter(m => m !== res.removeMadness);
            if (res.newMadness && res.newMadness.trim() && res.newMadness !== res.removeMadness) currentMadness.push(res.newMadness);
            return { ...prev, sanity: Math.max(0, prev.sanity - (res.sanityChange || 0)), life: Math.max(0, prev.life - (res.lifeChange || 0)), madness: currentMadness };
          });

          const newMessages = [...chatHistory];
          if (!isInitial && !userActionText.startsWith("【系統】")) newMessages.push({ role: 'user', text: userActionText });
          
          let statAlert = "";
          if (res.sanityChange > 0) statAlert += `⚠️ 理智值 -${res.sanityChange} `;
          if (res.lifeChange > 0) statAlert += `🩸 生命值 -${res.lifeChange} `;
          if (res.removeMadness) statAlert += `✨ 消除狂氣：【${res.removeMadness}】 `;
          if (res.newMadness && res.newMadness !== res.removeMadness) statAlert += `👁️ 獲得狂氣：【${res.newMadness}】 `;
          
          newMessages.push({ role: 'gm', text: statAlert ? `${statAlert}\n\n${res.narration}` : res.narration });
          
          if (res.options && Array.isArray(res.options) && res.options.length > 0) newMessages.push({ role: 'system', type: 'options', options: res.options });
          
          setChatHistory(newMessages);

          if (res.imagePrompt && typeof res.imagePrompt === 'object' && res.imagePrompt.generateCG) {
            setLoadingMsg(`正在進行 ${cgEngine === 'novelai' ? 'NovelAI' : 'Gemini'} 繪製場景 CG...`);
            try {
              let cgBase64 = "";
              if (cgEngine === 'novelai') cgBase64 = await generateNaiImageFn(res.imagePrompt);
              else cgBase64 = await generateImage(res.imagePrompt, player.image, npc.image, imgSettings);
              setChatHistory(prev => [...prev, { role: 'gm', text: '*(CG 更新)*', image: cgBase64 }]);
            } catch (e) { setChatHistory(prev => [...prev, { role: 'system', text: `⚠️ 圖像模型產生波動 (${e.message})，繼續文字冒險。` }]); }
          }
        } catch (err) { setError("通訊異常，請修改您的描述或稍後再試：" + err.message); } 
        finally { setLoading(false); setLoadingMsg(''); }
      };

      const handleOptionClick = (opt) => {
        setChatHistory(prev => prev.filter(m => m.type !== 'options'));
        const safePlayerSkills = player.stats?.skills || [];
        const fallbackSkill = safePlayerSkills.length > 0 ? safePlayerSkills[0] : '';
        
        const rawSkill1 = cleanSkillStr(opt.skill);
        const rawSkill2 = cleanSkillStr(opt.combatSkill2);
        
        const actualReqSkill = (rawSkill1 && getSkillInfo(rawSkill1).field !== '未知') ? rawSkill1 : fallbackSkill;
        const actualReqSkill2 = (rawSkill2 && getSkillInfo(rawSkill2).field !== '未知') ? rawSkill2 : actualReqSkill;
        
        if (opt.type === '特技判定') {
           setPendingRoll({ text: opt.text, reqSkill: actualReqSkill, consequences: opt.consequences });
           setSelectedPlayerSkill(fallbackSkill);
        } else if (opt.type === '戰鬥觸發') {
           setCombatState({ text: opt.text, reqSkill1: actualReqSkill, reqSkill2: actualReqSkill2, round: 1, failures: 0, logs: [] });
           setSelectedPlayerSkill(fallbackSkill);
        } else {
           processGmTurn(`【系統】玩家選擇了行動：${opt.text}。請根據此選擇結算結果並推進劇情。`, false);
        }
      };

      const handleDiceRoll = () => {
        if (!pendingRoll) return;
        const curiosity = player.stats?.curiosity || '';
        const fearSkill = cleanSkillStr(player.stats?.fear || '');
        const { target, details } = calculateTargetDetailed(pendingRoll.reqSkill, selectedPlayerSkill, curiosity);
        
        const reqInfo = getSkillInfo(pendingRoll.reqSkill);
        const playInfo = getSkillInfo(selectedPlayerSkill);
        const isFear = (reqInfo.exactName === fearSkill || playInfo.exactName === fearSkill);
        const fearMod = isFear ? -2 : 0; 
        
        const d1 = Math.floor(Math.random() * 6) + 1;
        const d2 = Math.floor(Math.random() * 6) + 1;
        const naturalTotal = d1 + d2;
        let finalTotal = naturalTotal + fearMod;
        
        const isCrit = naturalTotal >= 12;
        const isFumble = naturalTotal <= 2;
        let success = finalTotal >= target;
        if (isCrit) success = true;
        if (isFumble) success = false;
        
        let rollMsg = `🎲 執行【${formatSkill(pendingRoll.reqSkill)}】判定 (代用: ${formatSkill(selectedPlayerSkill)})\n目標計算：${details}\n擲骰結果：[${d1}, ${d2}] = ${naturalTotal}`;
        if (fearMod !== 0) rollMsg += ` (恐怖心修正 ${fearMod})`;
        rollMsg += `，達成值：${finalTotal} (最終目標值: ${target})`;
        
        if (isCrit) { rollMsg += `\n🌟 大成功！ (回復 1 點理智值)`; setPlayer(p => ({...p, sanity: Math.min(p.maxSanity, p.sanity + 1)})); } 
        else if (isFumble) rollMsg += `\n💀 大失敗！`;
        else rollMsg += success ? `\n✅ 判定成功！` : `\n❌ 判定失敗！`;
        
        const chosenText = pendingRoll.text;
        setPendingRoll(null);
        
        const sysMsg = `【系統】玩家選擇了行動：「${chosenText}」。\n${rollMsg}`;
        setChatHistory(prev => [...prev, { role: 'user', text: chosenText }, { role: 'system', text: rollMsg }]);
        processGmTurn(`${sysMsg}\n請根據判定結果(${success?'成功':'失敗'})結算劇情，給予事前承諾的具體影響（例如獎勵道具或扣除狂氣），然後給出新選項。`, false);
      };

      const handleCombatRoll = () => {
        if (!combatState) return;
        const currentReqSkill = combatState.round === 1 ? combatState.reqSkill1 : combatState.reqSkill2;
        const curiosity = player.stats?.curiosity || '';
        const fearSkill = cleanSkillStr(player.stats?.fear || '');
        const { target, details } = calculateTargetDetailed(currentReqSkill, selectedPlayerSkill, curiosity);
        
        const reqInfo = getSkillInfo(currentReqSkill);
        const playInfo = getSkillInfo(selectedPlayerSkill);
        const isFear = (reqInfo.exactName === fearSkill || playInfo.exactName === fearSkill);
        const fearMod = isFear ? -2 : 0; 
        
        const d1 = Math.floor(Math.random() * 6) + 1;
        const d2 = Math.floor(Math.random() * 6) + 1;
        const naturalTotal = d1 + d2;
        const finalTotal = naturalTotal + fearMod;
        
        let success = finalTotal >= target;
        if (naturalTotal >= 12) success = true;
        if (naturalTotal <= 2) success = false;

        let rollMsg = `⚔️ 戰鬥第 ${combatState.round}/2 回合：使用 ${formatSkill(selectedPlayerSkill)} 對抗 ${formatSkill(currentReqSkill)}。\n目標計算：${details}\n擲骰：[${d1}, ${d2}]${fearMod!==0?`(恐懼${fearMod})`:''} = 達成值 ${finalTotal} (目標值: ${target})。`;
        rollMsg += success ? ` ✅ 迴避/攻擊成功！` : ` ❌ 失敗！扣除 1 點生命值。`;

        const newFailures = combatState.failures + (success ? 0 : 1);
        const newLogs = [...(combatState.logs || []), rollMsg];

        if (!success) setPlayer(p => ({ ...p, life: Math.max(0, p.life - 1) }));

        if (combatState.round === 1) {
          setCombatState({ ...combatState, round: 2, failures: newFailures, logs: newLogs });
        } else {
          let finalSummary = `\n【系統】戰鬥結束。總計失敗 ${newFailures} 次。`;
          if (newFailures === 2) {
            finalSummary += `\n⚠️ 連續兩次失敗！強制獲得狂氣：【戰敗的創傷】。`;
            setPlayer(p => ({ ...p, madness: [...(p.madness || []), "戰敗的創傷"] }));
          } else if (newFailures === 0) finalSummary += `\n🌟 完美戰鬥！毫髮無傷。`;

          const completeLog = newLogs.join('\n') + finalSummary;
          const chosenText = combatState.text;
          
          setCombatState(null);
          setChatHistory(prev => [...prev, { role: 'user', text: chosenText }, { role: 'system', text: completeLog }]);
          processGmTurn(`【系統】玩家觸發了戰鬥：「${chosenText}」。\n${completeLog}\n請根據戰鬥結果描述後續發展，並給予新選項。`, false);
        }
      };

      const handleCustomInput = (e) => {
        e.preventDefault();
        const text = new FormData(e.target).get('action');
        if (!text || !text.trim()) return;
        setChatHistory(prev => prev.filter(m => m.type !== 'options'));
        setPendingRoll(null);
        setCombatState(null);
        processGmTurn(text.trim()); 
        e.target.reset();
      };

      const useAbility = (ab) => {
        const msg = `【系統】玩家宣告使用異能：【${ab.name}】 (效果：${ab.effect})`;
        setChatHistory(prev => [...prev, { role: 'system', text: msg }]);
        processGmTurn(`${msg}。請考量此異能對劇情的影響。`, false);
      };

      const useItem = (idx) => {
        const item = player.inventory[idx];
        if (item.count <= 0) return;
        const newInv = [...player.inventory];
        newInv[idx].count -= 1;
        setPlayer(p => {
          const newP = { ...p, inventory: newInv };
          if (item.baseType.includes('回復') || item.baseType.includes('鎮痛劑')) {
            if (newP.life < newP.maxLife) newP.life++;
            else if (newP.sanity < newP.maxSanity) newP.sanity++;
          }
          return newP;
        });
        const msg = `【系統】玩家消耗了道具：【${item.name}】(${item.baseType}效果)。`;
        setChatHistory(prev => [...prev, { role: 'system', text: msg }]);
        processGmTurn(`${msg}。請給予相應反饋。`, false);
      };

      // --- Setup UI (P5 Style) ---
      if (gameState === 'setup') {
        return (
          <div className="min-h-screen bg-black text-white p-4 md:p-8 flex items-center justify-center bg-pattern-dots">
            <div className="max-w-5xl w-full grid md:grid-cols-2 gap-10 bg-[#121212] border-4 border-[#e60012] shadow-[12px_12px_0px_0px_#fff] p-8 md:p-12 relative">
              <div className="absolute top-0 right-0 w-32 h-32 bg-[#e60012] transform translate-x-16 -translate-y-16 rotate-45 z-0 opacity-20"></div>
              
              <div className="space-y-8 relative z-10">
                <div>
                  <h1 className="text-4xl font-black text-white tracking-widest uppercase flex items-center p5-heading">
                    <Brain className="mr-3"/> TRPG
                  </h1>
                  <p className="text-white font-bold text-sm mt-3 bg-black inline-block px-2 border border-[#444] transform skew-x-[-10deg]"><span className="inline-block transform skew-x-[10deg]">視覺解析 ✖ 多角色 CG 生成 ✖ 劇本構築</span></p>
                </div>
                
                {/* 玩家設定區 */}
                <div className="p5-panel p-6 shadow-[6px_6px_0px_0px_#e60012]">
                  <h2 className="text-sm font-black text-white tracking-widest uppercase mb-4 border-b-2 border-[#e60012] pb-2">PC CONFIG / 玩家設定</h2>
                  <div className="mb-4">
                    <label className="flex flex-col items-center justify-center w-full h-32 border-4 border-[#444] border-dashed hover:border-[#e60012] hover:bg-[#1a1a1a] transition cursor-pointer">
                      {player.image ? <img src={player.image} alt="PC Preview" className="h-full object-cover p-1" /> : <div className="text-center"><Upload className="w-8 h-8 text-neutral-500 mx-auto mb-2 font-bold uppercase text-[10px]"/>UPLOAD IMAGE</div>}
                      <input type="file" className="hidden" accept="image/*" onChange={(e) => handleImageUpload(e, 'player')} />
                    </label>
                  </div>
                  <div className="flex gap-3">
                    <input type="text" value={player.name} onChange={e => setPlayer({...player, name: e.target.value})} placeholder="NAME / 名稱" className="w-1/3 p5-input p-3 text-sm rounded-none uppercase" required />
                    <input type="text" value={player.intro} onChange={e => setPlayer({...player, intro: e.target.value})} placeholder="PROFILE / 一句話設定" className="w-2/3 p5-input p-3 text-sm rounded-none" required />
                  </div>
                </div>

                {/* NPC 設定區 */}
                <div className={`p5-panel p-6 transition-all ${npcEnabled ? 'shadow-[6px_6px_0px_0px_#3b82f6] border-[#333]' : 'border-[#222] opacity-80'}`}>
                  <label className="flex items-center cursor-pointer mb-2">
                    <input type="checkbox" checked={npcEnabled} onChange={(e) => setNpcEnabled(e.target.checked)} className="accent-blue-600 w-5 h-5 mr-3" />
                    <span className={`text-sm font-black uppercase tracking-widest ${npcEnabled ? 'text-blue-500' : 'text-neutral-500'}`}>ENABLE COMPANION / 啟用 NPC</span>
                  </label>
                  
                  {npcEnabled && (
                    <div className="space-y-4 mt-4 animate-in fade-in zoom-in-95 duration-200">
                      <div>
                        <label className="flex flex-col items-center justify-center w-full h-24 border-4 border-[#444] border-dashed hover:border-blue-500 hover:bg-[#1a1a1a] transition cursor-pointer">
                          {npc.image ? <img src={npc.image} alt="NPC Preview" className="h-full object-cover p-1" /> : <Upload className="w-6 h-6 text-neutral-500" />}
                          <input type="file" className="hidden" accept="image/*" onChange={(e) => handleImageUpload(e, 'npc')} />
                        </label>
                      </div>
                      <div className="flex gap-3">
                        <input type="text" value={npc.name} onChange={e => setNpc({...npc, name: e.target.value})} placeholder="NAME / 名稱" className="w-1/3 p5-input p-3 text-sm rounded-none uppercase focus:border-blue-500 focus:shadow-[4px_4px_0px_0px_#3b82f6]" />
                        <input type="text" value={npc.intro} onChange={e => setNpc({...npc, intro: e.target.value})} placeholder="PROFILE / 一句話設定" className="w-2/3 p5-input p-3 text-sm rounded-none focus:border-blue-500 focus:shadow-[4px_4px_0px_0px_#3b82f6]" />
                      </div>
                    </div>
                  )}
                </div>

                {/* 推理引擎設定區 */}
                <div className="p5-panel p-6 shadow-[6px_6px_0px_0px_#3b82f6]">
                  <h2 className="text-sm font-black text-white tracking-widest uppercase mb-4 border-b-2 border-blue-500 pb-2 flex items-center">
                    <Cpu className="w-5 h-5 mr-2" /> TEXT AI ENGINE / 劇本推理引擎
                  </h2>
                  <div className="flex gap-6 mb-5">
                    <label className="flex items-center gap-2 cursor-pointer font-black uppercase text-sm">
                      <input type="radio" value="aistudio" checked={textAiSettings.provider === 'aistudio'} onChange={() => setTextAiSettings({...textAiSettings, provider: 'aistudio'})} className="accent-[#e60012] w-5 h-5" />
                      <span className={textAiSettings.provider === 'aistudio' ? 'text-blue-400' : 'text-neutral-500'}>AI STUDIO (預設)</span>
                    </label>
                    <label className="flex items-center gap-2 cursor-pointer font-black uppercase text-sm">
                      <input type="radio" value="gcp" checked={textAiSettings.provider === 'gcp'} onChange={() => setTextAiSettings({...textAiSettings, provider: 'gcp'})} className="accent-[#e60012] w-5 h-5" />
                      <span className={textAiSettings.provider === 'gcp' ? 'text-blue-400' : 'text-neutral-500'}>GCP (Vertex AI)</span>
                    </label>

                  <div className="mb-4">
                    <label className="block text-xs font-black uppercase text-neutral-400 mb-1">REASONING MODEL / 推理模型</label>
                    <select value={textAiSettings.model} onChange={e => setTextAiSettings({...textAiSettings, model: e.target.value})} className="w-full p5-input p-2 text-sm rounded-none font-bold">
                      <option value="gemini-2.5-flash-preview-09-2025">Gemini 2.5 Flash Preview 09-2025 (預設)</option>
                      <option value="gemini-2.5-flash-preview">Gemini 2.5 Flash Preview</option>
                      <option value="gemini-3-flash-preview">Gemini 3 Flash Preview</option>
                      <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
                      <option value="gemini-3.1-flash-lite-preview">Gemini 3.1 Flash Lite Preview</option>
                      <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash Lite</option>
                      <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro Preview</option>
                    </select>
                  </div>

                  {textAiSettings.provider === 'aistudio' && (
                    <div className="animate-in fade-in duration-200">
                      <label className="block text-xs font-black uppercase text-neutral-400 mb-1">API KEY</label>
                      <input type="password" value={textAiSettings.aiStudioKey} onChange={e => setTextAiSettings({...textAiSettings, aiStudioKey: e.target.value})} placeholder="留空則使用環境內建之 API KEY" className="w-full p5-input p-2 text-sm rounded-none" />
                    </div>
                  )}

                  {textAiSettings.provider === 'gcp' && (
                    <div className="space-y-4 animate-in fade-in duration-200">
                      <div>
                        <label className="block text-xs font-black uppercase text-neutral-400 mb-1">GCP 服務帳號金鑰 (JSON 檔案)</label>
                        <label className="flex flex-col items-center justify-center w-full h-16 border-2 border-[#444] border-dashed hover:border-blue-500 hover:bg-[#1a1a1a] transition cursor-pointer bg-black">
                          {textAiSettings.gcpCreds ? (
                            <span className="text-green-400 font-bold text-xs uppercase flex items-center">
                              ✅ 已載入專案: {textAiSettings.gcpCreds.project_id}
                            </span>
                          ) : (
                            <span className="text-neutral-500 font-bold text-xs uppercase flex items-center">
                              <Upload className="w-4 h-4 mr-2"/> 點擊上傳 JSON 服務文件
                            </span>
                          )}
                          <input type="file" accept=".json" className="hidden" onChange={handleGcpJsonUpload} />
                        </label>
                      </div>
                      <div>
                        <label className="block text-xs font-black uppercase text-neutral-400 mb-1">REGION / 服務區域</label>
                        <select value={textAiSettings.gcpRegion} onChange={e => setTextAiSettings({...textAiSettings, gcpRegion: e.target.value})} className="w-full p5-input p-2 text-sm rounded-none font-bold">
                          <option value="global">global</option>
                          <option value="us-central1">us-central1</option>
                          <option value="asia-east1">asia-east1</option>

                          <option value="europe-west1">europe-west1</option>
                        </select>
                      </div>

                  )}

              </div>
              
              <div className="space-y-8 flex flex-col relative z-10">

                {/* CG 引擎切換 */}
                <div className="p5-panel p-6 shadow-[6px_6px_0px_0px_#fff]">

                    <ImageIcon className="w-5 h-5 mr-2" /> CG ENGINE / 繪圖引擎
                  </h2>
                  <div className="flex gap-6 mb-5">

                      <div className={`absolute top-0 left-0 ${mainBg} text-white font-black px-3 py-1 uppercase tracking-widest text-xs transform -translate-y-full -translate-x-1 border-4 border-black`}>
                        {isCombat ? `COMBAT ROUND ${combatState.round}/2` : 'SKILL CHECK'}
                      </div>
                      <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4 border-b-2 border-[#333] pb-4 mt-2">
                        <div className="flex-1">
                          <p className="text-white font-bold text-sm leading-relaxed mb-2">{currentData.text}</p>
                          <p className="text-xs font-black uppercase text-neutral-400">REQ: <span className={mainColor}>{formatSkill(reqSkillText)}</span></p>
                        </div>
                        <div className="bg-[#1a1a1a] p-3 border-2 border-[#444] w-full md:w-auto shrink-0">
                          <div className="text-[10px] text-white font-black uppercase mb-1">SELECT SUBSTITUTE SKILL</div>
                          <select value={selectedPlayerSkill} onChange={e => setSelectedPlayerSkill(e.target.value)} className={`w-full p5-input p-2 text-sm focus:${borderCol} font-bold`}>
                            {(player.stats?.skills || []).map((s, i) => <option key={i} value={s}>{formatSkill(s)}</option>)}
                          </select>
                        </div>
                      </div>
                      <div className="flex flex-col md:flex-row justify-between items-center bg-[#1a1a1a] p-4 border-2 border-[#333] gap-4">
                        <div className="text-xs w-full md:w-auto flex-1 font-bold text-neutral-300">
                          <span className="block mb-1 uppercase text-[10px] text-neutral-500">CALCULATION (CURIOSITY: <span className="text-green-400">{player.stats?.curiosity || 'NONE'}</span>)</span>
                          <span className="font-mono text-white">{calculateTargetDetailed(reqSkillText, selectedPlayerSkill, player.stats?.curiosity || '').details}</span>
                          <div className="mt-2 text-sm font-black uppercase flex items-center flex-wrap gap-2">
                            TARGET VALUE: <span className="text-2xl text-white ml-2">{calculateTargetDetailed(reqSkillText, selectedPlayerSkill, player.stats?.curiosity || '').target}</span>
                            {((getSkillInfo(reqSkillText).exactName === cleanSkillStr(player.stats?.fear || '')) || (getSkillInfo(selectedPlayerSkill).exactName === cleanSkillStr(player.stats?.fear || ''))) && <span className="text-purple-400 border-2 border-purple-900 bg-purple-900/20 px-2 py-0.5 ml-2 transform skew-x-[-5deg]">FEAR PENALTY -2</span>}
                          </div>
                        </div>
                        <div className="flex gap-3 w-full md:w-auto">
                          {!isCombat && <button onClick={() => setPendingRoll(null)} className="w-full md:w-auto bg-black border-2 border-white text-white hover:bg-white hover:text-black font-black uppercase px-6 py-3 transition-colors">CANCEL</button>}
                          <button onClick={isCombat ? handleCombatRoll : handleDiceRoll} className={`w-full md:w-auto ${mainBg} text-white font-black uppercase px-8 py-3 border-2 border-transparent hover:border-white hover:bg-white hover:text-black transition-colors p5-shadow-white transform skew-x-[-5deg]`}>
                            <span className="inline-block transform skew-x-[5deg]">ROLL 2D6</span>
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })()}
                
                <form onSubmit={handleCustomInput} className="relative mt-2">
                  <div className="absolute top-0 left-0 bg-[#e60012] w-2 h-full z-10"></div>
                  <input type="text" name="action" placeholder={(pendingRoll || combatState) ? "AWAITING PANEL RESOLUTION..." : "INPUT ACTION / DIALOGUE..."} disabled={loading || pendingRoll !== null || combatState !== null} autoComplete="off" className="w-full bg-white border-4 border-black py-4 pl-6 pr-16 text-sm md:text-base text-black font-black placeholder-neutral-400 focus:border-[#e60012] outline-none disabled:opacity-50 p5-shadow-red transition-colors uppercase" />
                  <button type="submit" disabled={loading || pendingRoll !== null || combatState !== null} className="absolute right-2 top-2 bottom-2 bg-black hover:bg-[#e60012] text-white px-4 border-2 border-black transition disabled:opacity-50 flex items-center justify-center transform skew-x-[-5deg]">
                     <span className="inline-block transform skew-x-[5deg]"><Send className="w-6 h-6" /></span>
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
